name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # setiap hari jam 07.00 WIB
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4f7cac&color_dots=#ebedf0,#c6dbf0,#93bde3,#5b95cc,#2f6aa8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#93c5fd

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
